  /integrations/partner-callbacks/outcome:
    post:
      tags: [Cryptographic Integrations]
      summary: "Public partner webhook — verifies HMAC, timestamp, nonce, decrypts AES-256-GCM, applies outcome"
      operationId: "integrationsPartnerCallback"
      security:
        - PartnerHmacHeaders: []
      parameters:
        - name: X-Key-Id
          in: header
          required: true
          schema:
            type: string
          description: "Key ID used for HMAC and AES"
        - name: X-Timestamp
          in: header
          required: true
          schema:
            type: string
          description: "ISO 8601 timestamp (e.g., 2026-11-22T09:30:00Z)"
        - name: X-Nonce
          in: header
          required: true
          schema:
            type: string
          description: "Unique nonce (128-bit random, base64)"
        - name: X-Signature-256
          in: header
          required: true
          schema:
            type: string
          description: "HMAC-SHA256 signature in format 'sha256=<hex>'"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference_code, outcome]
              properties:
                reference_code:
                  type: string
                  pattern: "^INT-\\d{4}-\\d{4}$"
                outcome:
                  type: string
                  enum: [interview_passed, interview_failed]
                remarks:
                  type: string
                  maxLength: 2000
                  nullable: true
      responses:
        '200':
          description: "Callback verified and outcome applied"
          headers:
            X-API-Contract-Version:
              schema:
                type: string
            X-OpenAPI-Spec:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessEnvelope"
                properties:
                  data:
                    type: object
                    required: [application, envelope, applied_transition]
                    properties:
                      application:
                        $ref: "#/components/schemas/InternshipApplication"
                      envelope:
                        $ref: "#/components/schemas/SecureIntegrationEnvelope"
                      applied_transition:
                        type: object
                        required: [outcome, from_status, to_status]
                        properties:
                          outcome:
                            type: string
                          from_status:
                            type: string
                          to_status:
                            type: string
        '401':
          description: "Signature verification failed or timestamp expired"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        '404':
          description: "Unknown application reference"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        '409':
          description: "Replay attack detected (nonce already consumed)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
        '422':
          description: "Tampered ciphertext or invalid outcome"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorEnvelope"
        '429':
          description: "Rate limited (30/min per key + IP)"
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorEnvelope"
